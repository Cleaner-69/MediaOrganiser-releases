name: An idea or wish
description: Something that would make the app easier or more useful.
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help you?
      description: For example "I would not have to rename my kids' films by hand".
    validations:
      required: false
